[tools]
hk = "latest"
pkl = "latest"
rumdl = "latest"
trufflehog = "latest"
jq = "latest"

[tasks.bootstrap]
description = "Install mise tools + hk git hooks"
run = [
    "mise install",
    "hk install",
]

[tasks.sync]
description = "Sync hook, settings, and user CLAUDE.md into ~/.claude and ~/.claude-dpg"
run = """
set -e
# Each seat gets generic_settings.json, then its own overlay (if any) for the
# identity slots that differ. ~/.claude is the personal seat; ~/.claude-dpg is
# the DPG Media work seat, launched via `claude-dpg-seat` (CLAUDE_CONFIG_DIR).
for ENTRY in "$HOME/.claude:" "$HOME/.claude-dpg:dpg_settings.json"; do
  DIR="${ENTRY%%:*}"
  OVERLAY="${ENTRY#*:}"
  mkdir -p "$DIR/hooks"
  cp hooks/block-commands.sh "$DIR/hooks/block-commands.sh"
  chmod +x "$DIR/hooks/block-commands.sh"
  echo "Installed hook -> $DIR/hooks/block-commands.sh"
  SETTINGS="$DIR/settings.json"
  if [ -f "$SETTINGS" ]; then
    # Shallow top-level merge, generic_settings.json wins. del() retires keys that
    # were removed from generic_settings.json — a merge alone never drops them.
    jq -s '.[0] + .[1] | del(.model, .skipDangerousModePermissionPrompt)' \
      "$SETTINGS" generic_settings.json > "$SETTINGS.tmp" && mv "$SETTINGS.tmp" "$SETTINGS"
    echo "Merged generic_settings.json -> $SETTINGS"
  else
    cp generic_settings.json "$SETTINGS"
    echo "Created $SETTINGS from generic_settings.json"
  fi
  if [ -n "$OVERLAY" ]; then
    jq -s -f overlay.jq "$SETTINGS" "$OVERLAY" > "$SETTINGS.tmp" && mv "$SETTINGS.tmp" "$SETTINGS"
    echo "Applied $OVERLAY -> $SETTINGS"
  fi
  cp user_memory/CLAUDE.md "$DIR/CLAUDE.md"
  echo "Installed user CLAUDE.md -> $DIR/CLAUDE.md"
done
"""
