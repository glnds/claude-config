[tools]
hk = "latest"
pkl = "latest"
rumdl = "latest"
trufflehog = "latest"
jq = "latest"

[tasks.bootstrap]
description = "Install mise tools + hk git hooks"
run = [
    "mise install",
    "hk install",
]

[tasks.test]
description = "Smoke-test the quality-gate hooks against throwaway repositories"
run = "bash quality/tests/smoke.sh"

[tasks.sync]
description = "Sync hooks, settings, agents, quality gate and user AGENTS.md (+ CLAUDE.md import) into ~/.claude and ~/.claude-dpg"
run = """
set -e
# Each seat gets generic_settings.json, then its own overlay (if any) for the
# identity slots that differ. ~/.claude is the personal seat; ~/.claude-dpg is
# the DPG Media work seat, launched via `claude-dpg-seat` (CLAUDE_CONFIG_DIR).
for ENTRY in "$HOME/.claude:" "$HOME/.claude-dpg:dpg_settings.json"; do
  DIR="${ENTRY%%:*}"
  OVERLAY="${ENTRY#*:}"
  mkdir -p "$DIR/hooks"
  for HOOK in hooks/*.sh; do
    cp "$HOOK" "$DIR/hooks/"
    chmod +x "$DIR/hooks/$(basename "$HOOK")"
    echo "Installed hook -> $DIR/hooks/$(basename "$HOOK")"
  done
  SETTINGS="$DIR/settings.json"
  if [ -f "$SETTINGS" ]; then
    # Shallow top-level merge, generic_settings.json wins. del() retires keys that
    # were removed from generic_settings.json — a merge alone never drops them.
    jq -s '.[0] + .[1] | del(.model, .skipDangerousModePermissionPrompt)' \
      "$SETTINGS" generic_settings.json > "$SETTINGS.tmp" && mv "$SETTINGS.tmp" "$SETTINGS"
    echo "Merged generic_settings.json -> $SETTINGS"
  else
    cp generic_settings.json "$SETTINGS"
    echo "Created $SETTINGS from generic_settings.json"
  fi
  if [ -n "$OVERLAY" ]; then
    jq -s -f overlay.jq "$SETTINGS" "$OVERLAY" > "$SETTINGS.tmp" && mv "$SETTINGS.tmp" "$SETTINGS"
    echo "Applied $OVERLAY -> $SETTINGS"
  fi
  cp user_memory/AGENTS.md user_memory/CLAUDE.md "$DIR/"
  echo "Installed user AGENTS.md + CLAUDE.md import -> $DIR"
  mkdir -p "$DIR/agents"
  cp agents/*.md "$DIR/agents/"
  echo "Installed agents -> $DIR/agents"
done
# Quality gate: one install for both seats (hook commands use $HOME/.claude/quality),
# so trust approvals are shared. tests/ stays in the repo; trusted.json is never touched.
QG="$HOME/.claude/quality"
mkdir -p "$QG"
rsync -a --delete --exclude tests/ --exclude trusted.json quality/ "$QG/"
echo "Installed quality gate -> $QG"
"""
